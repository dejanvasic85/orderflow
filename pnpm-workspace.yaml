allowBuilds:
  "@sentry/cli": true
  esbuild: true
  lightningcss: true
  msw: true
  sharp: true
  supabase: true
  workerd: true

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.2
  vite-plus: 1.0.0
  "@vitest/coverage-v8": 5.0.2
