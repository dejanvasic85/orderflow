name: Cleanup Preview

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read

env:
  # The Worker every Preview belongs to, from wrangler.jsonc.
  workerName: orderflow

jobs:
  cleanup-preview:
    name: Delete preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compute preview name
        id: meta
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          branch_slug=$(printf '%s' "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g')
          branch_slug="${branch_slug:0:24}"
          echo "preview_name=pr-${PR_NUMBER}-${branch_slug}" >> "$GITHUB_OUTPUT"

      # One API call, so no checkout, install or wrangler is needed.
      - name: Delete preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: ${{ steps.meta.outputs.preview_name }}
        run: |
          status=$(curl -sS -o /tmp/cf-delete-response.json -w '%{http_code}' -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/workers/${workerName}/previews/${PREVIEW_NAME}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          if [ "$status" = "404" ]; then
            echo "Preview ${PREVIEW_NAME} is already gone."
          elif [ "$status" = "200" ] || [ "$status" = "204" ]; then
            echo "Deleted preview ${PREVIEW_NAME}."
          else
            echo "::error::Could not delete preview ${PREVIEW_NAME} (HTTP ${status})."
            cat /tmp/cf-delete-response.json
            exit 1
          fi
