name: Deploy Preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # The Worker every Preview belongs to, from wrangler.jsonc.
  workerName: orderflow
  # Account's workers.dev subdomain: a Preview resolves to
  # https://<preview>-<worker>.<this>.workers.dev
  workersSubdomain: vasic-studio

jobs:
  deploy-preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Verify required secrets
        run: vp exec tsx deployment/verifyEnv.ts preview
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build
        run: vp run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ORG: ${{ secrets.VITE_SENTRY_ORG }}
          VITE_SENTRY_PROJECT: ${{ secrets.VITE_SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Compute preview name
        id: meta
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          branch_slug=$(printf '%s' "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g')
          branch_slug="${branch_slug:0:24}"
          echo "preview_name=pr-${PR_NUMBER}-${branch_slug}" >> "$GITHUB_OUTPUT"

          # A Preview URL is deterministic from its name and the Worker name, so it can
          # be injected as SITE_URL before the deploy reports the same URL back.
          echo "preview_url=https://pr-${PR_NUMBER}-${branch_slug}-${workerName}.${workersSubdomain}.workers.dev" >> "$GITHUB_OUTPUT"

      # A Preview gets a workers.dev URL only once the parent Worker has
      # previews_enabled. Production sends it from `preview_urls`, but this pull
      # request can run before that deploy, so set it here and keep workers.dev as is.
      - name: Enable Preview URLs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          subdomain_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${workerName}/subdomain"
          workers_dev=$(curl -sS -f "$subdomain_url" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | jq -r '.result.enabled')
          curl -sS -f -X POST "$subdomain_url" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Cloudflare-Workers-Script-Api-Date: 2025-08-01" \
            --data "{\"enabled\":${workers_dev},\"previews_enabled\":true}" > /dev/null

      - name: Deploy preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Wrangler writes one JSON entry per command here, including the URL.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-preview.jsonl
          PREVIEW_NAME: ${{ steps.meta.outputs.preview_name }}
          PREVIEW_URL: ${{ steps.meta.outputs.preview_url }}
        run: |
          vp exec wrangler preview \
            -c dist/server/wrangler.json \
            --name "$PREVIEW_NAME" \
            --worker-name "$workerName" \
            --var SITE_URL:"$PREVIEW_URL"

      - name: Read preview URL
        id: url
        env:
          expected_url: ${{ steps.meta.outputs.preview_url }}
        run: |
          preview_url=$(jq -r 'select(.type == "preview") | .preview_urls[0] // empty' \
            "${{ runner.temp }}/wrangler-preview.jsonl" | tail -1)
          : "${preview_url:?Wrangler reported no Preview URL}"
          preview_url="${preview_url%/}"
          if [ "$preview_url" != "$expected_url" ]; then
            echo "::error::Wrangler served the Preview at ${preview_url}, but SITE_URL was set to ${expected_url}."
            exit 1
          fi
          echo "deploy_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Sync preview secrets
        run: vp exec tsx deployment/syncWorkerSecrets.ts --preview "${{ steps.meta.outputs.preview_name }}" --worker "$workerName"
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.url.outputs.deploy_url }}
          PREVIEW_NAME: ${{ steps.meta.outputs.preview_name }}
        with:
          script: |
            const marker = '<!-- preview-worker-url -->'
            const previewUrl = process.env.PREVIEW_URL
            const previewName = process.env.PREVIEW_NAME

            const body = [
              marker,
              `Preview deployment is ready: ${previewUrl}`,
              `Preview: \`${previewName}\``,
            ].join('\n\n')

            const { owner, repo } = context.repo
            const issue_number = context.issue.number

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            })

            const existing = comments.data.find(
              (comment) => comment.user.type === 'Bot' && comment.body.includes(marker),
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              })
            }
